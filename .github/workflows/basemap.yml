name: Basemap

# Builds world-basemap.mbtiles (see basemap/README.md) for the Cockpit app to download at first start, and
# unpacks it into docs/tiles for the map page on GitHub Pages (https://bylenny.github.io/maps/).
# Runs on every change to the build and when started by hand. The file is published as the asset of the
# "basemap" release in this repository, which the app downloads from:
#   https://github.com/byLenny/maps/releases/download/basemap/world-basemap.mbtiles
# The release is never marked "latest".
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/basemap.yml
      - basemap/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: basemap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the world basemap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev sqlite3
          git clone --depth 1 https://github.com/felt/tippecanoe.git "$RUNNER_TEMP/tippecanoe"
          make -C "$RUNNER_TEMP/tippecanoe" -j"$(nproc)"
          sudo make -C "$RUNNER_TEMP/tippecanoe" install

      - name: Build the map
        run: basemap/build.sh

      - name: Check the map
        run: |
          FILE=basemap/output/world-basemap.mbtiles
          {
            echo "### world-basemap.mbtiles"
            echo "Size: $(du -h "$FILE" | cut -f1) ($(stat -c %s "$FILE") bytes)"
            echo
            echo "Layers: $(sqlite3 "$FILE" "SELECT value FROM metadata WHERE name='json';" | grep -o '"id":"[a-z_]*"' | tr '\n' ' ')"
            echo "Tiles by zoom:"
            sqlite3 "$FILE" "SELECT zoom_level || ': ' || count(*) FROM tiles GROUP BY zoom_level ORDER BY zoom_level;"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for layer in ocean land lakes boundaries; do
            sqlite3 "$FILE" "SELECT value FROM metadata WHERE name='json';" | grep -q "\"id\":\"$layer\"" \
              || { echo "::error::layer $layer is missing"; exit 1; }
          done

      - name: Export the tiles for GitHub Pages
        run: python3 basemap/export-pages.py basemap/output/world-basemap.mbtiles docs

      - name: Commit the Pages tiles
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "The Pages tiles did not change."
          else
            git commit -qm "Update the Pages map tiles from the basemap build"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: world-basemap
          path: basemap/output/world-basemap.mbtiles
          retention-days: 14

      - name: Publish as the basemap release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=basemap/output/world-basemap.mbtiles
          if gh release view basemap --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload basemap "$FILE" --clobber --repo "${{ github.repository }}"
          else
            gh release create basemap "$FILE" \
              --repo "${{ github.repository }}" \
              --latest=false \
              --title "World basemap" \
              --notes "Rough world map (zoom 0-5) from Natural Earth, public domain. Downloaded by the Cockpit app at first start."
          fi
